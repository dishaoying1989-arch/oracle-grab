name: Oracle Grab

# ======================= 运行方式：自我接力长棒（不依赖 GitHub cron） =======================
# 为什么不用 schedule 作为主方案：
#   实测**本仓库**的 schedule 事件完全不投递 —— 私有期间 UTC 06:07/08:07/09:07/09:37/09:55/10:00
#   等十几个触发点全部落空；转 Public 之后再用 "*/5"（每 5 分钟）测试，
#   10:45 / 10:50 / 10:55 / 11:00 依然一次没跑（API 查 event=schedule → total_count=0），
#   而 workflow_dispatch 次次成功。GitHub 官方状态页显示 Actions 一切正常。
#   已排除：cron 语法（逗号/多条/星号都试过）、default_branch、Actions 权限、
#           token scope、账号状态、是否 fork、有无阻塞中的 run。
#   ⚠ 注：不能推广成"私有仓库 schedule 都不投递" —— 另一个账号下的私有仓库
#     dishaoying/oracle-grab 有 2 次成功的 schedule 运行。只能说本仓库/本账号的
#     定时投递有问题，根因未明。（2026-10-30 起观察到 schedule 恢复投递，每小时
#     07/37 分两个 cron 均正常触发，作为链路断掉时的兜底短棒继续保留。）
#
# 现在怎么做：
#   单次 run 连续抢 5.4 小时（GitHub 单个 job 上限 6 小时，留 30 分钟缓冲），
#   跑满前调 GitHub API 启动下一棒 —— 形成接力链。
#   只需手动启动一次（relay=true），之后全天不间断；电脑关机、卸载 WorkBuddy 都不受影响。
#   这比"每 30 分钟跑 4 分钟"强得多：中间没有空档，是真·24 小时连续蹲守。
#
# 为什么仓库是 Public（与定时无关，是分钟额度决定的）：
#   Free 账号的私有仓库每月只有 2000 分钟 Actions ≈ 33 小时 ≈ 每天 1.1 小时；
#   而接力长棒是 24 小时不停，公开仓库才无分钟上限。
#   代价是代码与运行日志可见 —— 所以脚本里不许出现任何硬编码凭据：
#   OCI 私钥 / Server酱 Key / SSH 公钥 / 接力用 PAT 全部存在 Secrets（加密存储），
#   compartment 也改为由 OCI_CONFIG_JSON 里的 tenancy 推断。
#
# 推送安排（老板定：一天只发一条，且关机也要能收到）：
#   每天北京时间 **02:00**，云端脚本发一条《战报 + 链路体检》合并日报 —— 跑在 GitHub 上，
#   电脑关机/卸载 WorkBuddy 都不影响。体检部分（24h 运行次数、失败数、有无空档、有无重复棒）
#   由脚本内的 chain_health() 只读查 GitHub API 生成。
#   本机 WorkBuddy 的 02:25 体检自动化改为**静默巡检**：只修问题，不发日常推送
#   （Server酱 Turbo 免费额度每天仅 5 条，省下来留给"抢到机"这类即时事件）。
#   ⚠ 哪天 02:00 没收到日报，基本就是链断了 → 去 Actions 页面手动
#     Run workflow（relay 选 true）即可重新接上。
# ======================================================================================
on:
  schedule:
    - cron: "7 * * * *"
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      rounds:
        description: "非接力模式的尝试轮数"
        required: false
        default: "3"
      relay:
        description: "接力模式：跑满 5.4 小时后自动启动下一棒（true/false）"
        required: false
        default: "false"
      dry_run:
        description: "只查询不创建（true/false）"
        required: false
        default: "false"

# 防止上一棒还没退场、下一棒就开抢（同一 Oracle 账号只应有一个抢机进程）
concurrency:
  group: oracle-grab
  cancel-in-progress: false

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # 6 小时是 GitHub 硬上限，留 30 分钟缓冲
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install --quiet oci requests

      # 跨 run 的"今日累计"状态（cache 按天滚动）
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: .grab_state
          key: grab-state-${{ github.run_id }}
          restore-keys: |
            grab-state-

      - name: Grab
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          OCI_CONFIG_JSON: ${{ secrets.OCI_CONFIG_JSON }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          SSH_PUB_KEY: ${{ secrets.SSH_PUB_KEY }}
          GRAB_STATE_DIR: .grab_state
          # 供脚本内 chain_health() 只读查本仓库 Actions 运行记录（体检信息并入 02:00 日报）
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "$(date +%s)" > /tmp/grab_start_ts
          python scripts/oracle_grab_actions.py \
            --rounds "${{ github.event.inputs.relay == 'true' && '9999' || github.event.inputs.rounds || '3' }}" \
            --max-seconds "${{ github.event.inputs.relay == 'true' && '19500' || '0' }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      # 失败也把日志抛出来，方便在 Actions 页面直接看
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ github.run_id }}
          path: .grab_state/
          if-no-files-found: ignore
          retention-days: 3

      # 接力：本棒快跑满时启动下一棒。用 PAT 而非 GITHUB_TOKEN
      # （GITHUB_TOKEN 触发的事件不会再唤起新的 workflow，会断链）
      # 2026-10-31 加固：#261 交棒时 dispatch 被 GitHub 静默吞掉（无报错、无新 run），
      # 链路断了 40 小时才发现。现在：状态回显 + 失败重试 + 确认新 run 真的出现了才算成功。
      # 多次 dispatch 是安全的：concurrency 组里新的 pending 会取代旧的 pending，绝不会双棒同抢。
      - name: 接力下一棒
        if: always() && github.event.inputs.relay == 'true'
        env:
          PAT: ${{ secrets.GH_PAT }}
        run: |
          st=$(cat /tmp/grab_start_ts 2>/dev/null || echo 0)
          el=$(( $(date +%s) - st ))
          echo "本棒运行 ${el}s"
          if [ "$el" -lt 300 ]; then
            echo "⚠ 本棒异常早退（不足 5 分钟），不接力，避免空转循环"
            exit 0
          fi
          cur=${{ github.run_number }}
          for a in 1 2 3 4 5; do
            code=$(curl -sS -X POST -o /tmp/disp_resp.txt -w "%{http_code}" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $PAT" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/oracle-grab.yml/dispatches" \
              -d '{"ref":"main","inputs":{"relay":"true"}}')
            echo "第 $a 次触发下一棒：HTTP $code"
            if [ "$code" != "204" ]; then
              echo "触发失败，响应体："; cat /tmp/disp_resp.txt; echo
              sleep 10
              continue
            fi
            # 204 ≠ 万无一失：GitHub 偶发把 dispatch 静默吞掉，必须看到新 run 才算数
            for v in 1 2 3 4 5; do
              sleep 15
              latest=$(curl -sS -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $PAT" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs?event=workflow_dispatch&per_page=1" \
                | jq -r '.workflow_runs[0].run_number // 0')
              echo "  校验 $v：最新接力 run = #$latest（本棒 #$cur）"
              if [ "${latest:-0}" -gt "$cur" ] 2>/dev/null; then
                echo "✅ 下一棒 #$latest 已启动，接力成功"
                exit 0
              fi
            done
            echo "⚠ dispatch 返回 204 但 75 秒内未见新 run（疑似被静默吞掉），重试"
          done
          echo "❌ 接力失败：5 次触发均未确认新 run，链路将断 —— 查 GH_PAT 是否有效、
          或去 Actions 页面手动 Run workflow（relay=true）"
          exit 1
