name: Oracle Grab

# 全天持续抢机：每 30 分钟拉起一次（每小时的 07 分 / 37 分，避开整点调度高峰），
# 每次 run 内做 3 轮尝试。
# 2026-10-13 已转为 Public 仓库 —— 原因：GitHub Free 账号的「私有仓库」schedule 定时
#   根本不会触发（未公开限制，社区已确认），只有 workflow_dispatch / push 能跑。
#   实测：私有期间 UTC 06:07/08:07/09:07/09:37/09:55/10:00 等十几个触发点全部落空。
#   转 Public 后：schedule 正常 + Actions 分钟无限，30 分钟一轮无任何额度压力。
#   安全：OCI 私钥 / Server酱 Key / SSH 公钥都在 Secrets（加密），脚本内无硬编码凭据；
#        compartment 由 OCI_CONFIG_JSON 的 tenancy 推断，也未硬编码租户 OCID。
#   ⚠ 若要转回私有，必须先换成 Pro 账号或用外部 cron 打 workflow_dispatch，否则会停摆。
on:
  schedule:
    # 每 30 分钟一次：每小时的第 7 分和第 37 分（避开整点调度高峰）。
    # 用两条独立 cron 条目，比 "7,37 * * * *" 逗号写法更稳。
    - cron: "7 * * * *"
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      rounds:
        description: "本次 run 的尝试轮数"
        required: false
        default: "3"
      dry_run:
        description: "只查询不创建（true/false）"
        required: false
        default: "false"

# 防止定时与手动触发并发抢机
concurrency:
  group: oracle-grab
  cancel-in-progress: false

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install --quiet oci requests

      # 跨 run 的"今日累计"状态（cache 按天滚动）
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: .grab_state
          key: grab-state-${{ github.run_id }}
          restore-keys: |
            grab-state-

      - name: Grab
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          OCI_CONFIG_JSON: ${{ secrets.OCI_CONFIG_JSON }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          SSH_PUB_KEY: ${{ secrets.SSH_PUB_KEY }}
          GRAB_STATE_DIR: .grab_state
        run: |
          python scripts/oracle_grab_actions.py \
            --rounds "${{ github.event.inputs.rounds || '3' }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      # 失败也把日志抛出来，方便在 Actions 页面直接看
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ github.run_id }}
          path: .grab_state/
          if-no-files-found: ignore
          retention-days: 3
