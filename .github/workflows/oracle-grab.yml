name: Oracle Grab

# 全天持续抢机：每 2 小时拉起一次（UTC 奇数小时 07 分，避开整点调度高峰），
# 每次 run 内做 3 轮尝试。私有仓库免费额度 2000 分钟/月，本节奏约 1800 分钟/月，
# 不会超额停摆。若把仓库设为 Public（Actions 免费无限），可改为每 30 分钟一次：
#   cron: "7,37 * * * *"   并把 ROUNDS 调到 4
on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:
    inputs:
      rounds:
        description: "本次 run 的尝试轮数"
        required: false
        default: "3"
      dry_run:
        description: "只查询不创建（true/false）"
        required: false
        default: "false"

# 防止定时与手动触发并发抢机
concurrency:
  group: oracle-grab
  cancel-in-progress: false

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install --quiet oci requests

      # 跨 run 的"今日累计"状态（cache 按天滚动）
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: .grab_state
          key: grab-state-${{ github.run_id }}
          restore-keys: |
            grab-state-

      - name: Grab
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          OCI_CONFIG_JSON: ${{ secrets.OCI_CONFIG_JSON }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          SSH_PUB_KEY: ${{ secrets.SSH_PUB_KEY }}
          GRAB_STATE_DIR: .grab_state
        run: |
          python scripts/oracle_grab_actions.py \
            --rounds "${{ github.event.inputs.rounds || '3' }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      # 失败也把日志抛出来，方便在 Actions 页面直接看
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ github.run_id }}
          path: .grab_state/
          if-no-files-found: ignore
          retention-days: 3
