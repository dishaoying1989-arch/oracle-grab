name: Oracle Grab

# 全天持续抢机：每 30 分钟拉起一次（每小时的 07 分 / 37 分，避开整点调度高峰），
# 每次 run 内做 3 轮尝试。
# ⚠ 分钟额度（老板已决定：保持私有仓库 + 硬跑 30 分钟，接受超额）：
#    实测单 run 约 4~5 分钟 → 48 run/天 ≈ 216 分钟/天 ≈ 6500 分钟/月。
#    私有仓库免费额度 2000 分钟/月 → 大约第 9~10 天额度耗尽，当月剩余时间 Actions 会被停。
#    省额度三种改法（改这里 + push 即生效）：
#      1) 降 rounds：inputs.rounds 默认 "3" → "2"（≈14 天）/ "1"（≈24 天）
#      2) 降频：cron 改 "7 */2 * * *"（每 2 小时，≈1800 分钟/月，可跑满一个月）
#      3) 转 Public（Actions 无限量，但仓库会被任何人看到 → 必须确认无敏感信息）
#    额度恢复时间：GitHub 每月按账号注册日重置。
on:
  schedule:
    # ⚠ 临时诊断用：每 5 分钟一次，验证 schedule 机制是否正常。
    # 验证完必须改回 "7 * * * *" + "37 * * * *"（每 30 分钟），否则分钟额度瞬间烧光。
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      rounds:
        description: "本次 run 的尝试轮数"
        required: false
        default: "3"
      dry_run:
        description: "只查询不创建（true/false）"
        required: false
        default: "false"

# 防止定时与手动触发并发抢机
concurrency:
  group: oracle-grab
  cancel-in-progress: false

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install --quiet oci requests

      # 跨 run 的"今日累计"状态（cache 按天滚动）
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: .grab_state
          key: grab-state-${{ github.run_id }}
          restore-keys: |
            grab-state-

      - name: Grab
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          OCI_CONFIG_JSON: ${{ secrets.OCI_CONFIG_JSON }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          SSH_PUB_KEY: ${{ secrets.SSH_PUB_KEY }}
          GRAB_STATE_DIR: .grab_state
        run: |
          python scripts/oracle_grab_actions.py \
            --rounds "${{ github.event.inputs.rounds || '3' }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      # 失败也把日志抛出来，方便在 Actions 页面直接看
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ github.run_id }}
          path: .grab_state/
          if-no-files-found: ignore
          retention-days: 3
