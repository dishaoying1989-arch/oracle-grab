name: tmp-inbound-test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Pull from VPS
        run: |
          echo "runner IP: $(curl -s https://api.ipify.org)"
          for i in 1 2 3; do
            curl -s -o /dev/null -w "  pull$i: %{speed_download} B/s\n" --max-time 40 http://140.83.58.8:80/big.bin
          done
